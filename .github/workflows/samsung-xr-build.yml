name: Samsung XR Build

on:
  push:
    branches: [samsung-xr, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - release

env:
  UNITY_VERSION: "6000.1.17f1"
  BUILD_TARGET: Android
  PROJECT_PATH: .

jobs:
  build:
    name: Samsung XR ${{ github.event.inputs.build_type || 'development' }} Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/*.asset') }}
          restore-keys: |
            Library-Android-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: SamsungXRBuilder.BuildRelease
          androidAppBundle: false
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlasticBagGame-SamsungXR-${{ github.sha }}
          path: Builds/*.apk
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## Samsung XR Build Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Unity:** ${{ env.UNITY_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ github.event.inputs.build_type || 'development' }}" >> $GITHUB_STEP_SUMMARY
          if [ -f Builds/*.apk ]; then
            SIZE=$(du -sh Builds/*.apk | cut -f1)
            echo "- **APK Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
